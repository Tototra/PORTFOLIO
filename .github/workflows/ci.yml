# Vérifications à chaque push et pull request. Le déploiement lui-même est
# fait par Cloudflare Pages, qui reconstruit le site depuis la branche main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint:text
      - run: npm run build
      - run: npm audit --audit-level=high
